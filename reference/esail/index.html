iews\n\neSail News\n\nSailing Challenges\n\neSail will help you develop your skills with races, steering challenges, anchoring, ‘know your boat’ challenges and other sailing games. Receive gold, silver or bronze medals and see your results in the eSail leaderboards.\n\nAnchoring\n\nIn these challenges you anchor up, then we check your swing circle by applying different wind directions.\n\nYou need to take into account the condition of the sea bed and lay down enough anchor chain.\n\neSail Races\n\nWith eSail races you pit your skills against ‘computer skippered’ boats without having to worry about all the rules and regulations of a real sailing regatta. You will become skilled at race tactics, tacking, gybing and trimming the sails including using the mainsheet, jib sheets and kicker (boom vang).\n\nSee also Live Sailing races\n\nPassage Planning\n\nUsing our unique boat simulator charting tool, create a course between locations such as Maxwell Marina and Frazer Town via given waypoints. At the end of your voyage make sure you moor up safely (using your fenders) without making contact with the jetty.\n\nTreasure Hunts\n\nIt’s all about throttle control! You need to get close enough to click on your prize without drifting into the jetty or quay.\n\nIn this fun sailing game, don’t go too fast when you grab your vase or it will end up smashed on the deck!\n\nHere is a quiz to check your sailing knowledge!\n\n1.\n\nLooking forward on a boat, which side is ‘starboard’?\n\nLeft\n\nRight\n\nIt depends which way you are facing\n\n2.\n\nA line used to hoist or lower a sail is called what?\n\nStay\n\nSheet\n\nWarp\n\nHalyard\n\n3.\n\nHow many ropes are there on sailing boat?\n\nNone\n\nAbout 20\n\nNormally none but can be one or two\n\nAbout 10\n\n4.\n\nThe wind felt by those aboard a moving boat is known as what?\n\nTrue Wind\n\nApparent Wind\n\nCompass Wind\n\nSailing Wind\n\n5.\n\nThe guard rail and area around the forward deck is known as the ‘pulpit’.\n\nTrue\n\nFalse\n\n6.\n\nWhen your boat is stuck pointing straight into the wind so you cannot sail, you are in what?\n\nIn biskit\n\nIn steel\n\nIn irons\n\nIn a mess\n\n7.\n\nA ‘pan-pan’ distress signal sent by radio means what?\n\n“We urgently need cooking equipment”\n\n“We are attending a boat in distress”\n\n“We have an urgent, but not immediately life threatening situation”\n\n“We have a life threatening situation on board”\n\n8.\n\nWhen a wind is ‘veering’ it is doing what?\n\nFilling the sails\n\nChanging direction (clockwise)\n\nAccelerating\n\nMoving to the South\n\n9.\n\nA typical small sailing yacht with mainsail and jib is known as what?\n\nA galley\n\nA frigate\n\nA cutter\n\nA sloop\n\n10.\n\nThe best way to learn to sail is on a real boat.\n\nTrue\n\nFalse\n\nLaden …\n\nPage\n\n1\n\nof 10\n\neSail is available for Windows and Apple Mac.\n\nJoin the eSailing community now!\n\nHOW TO PURCHASE\n\nFollow Us\n\nSupport\n\nHow to Purchase\n\nRegistered Office:\n\nSuite 3 1-3 Warren Court Park Road, Crowborough, East Sussex, England, TN6 2QX\n\neSail ® is a registered trademark. © 2026 Copyright eSail Ltd.\n\nWhile all reasonable care has been taken in producing eSail the publisher can accept no responsibility for any errors or omissions or consequences of using any methods or processes described. The world and charts included in eSail are entirely fictional and must not be used for navigation.\n\nPrivacy Policy\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nChange Language\n\nClose and do not switch language\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nChange Language\n\nClose and do not s E.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/tr_TR.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/es_ES.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/pt_PT.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/pt_BR.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/el.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/it_IT.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/nl_NL.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/uploads/2019/03/star.png", "alt": ""}, {"url": "http://www.esailyachtsimulator.com/wp-content/uploads/2019/03/quizback.gif", "alt": ""}], "stylesheets": ["https://www.esailyachtsimulator.com/wp-content/plugins/contact-form-7/includes/css/styles.css?ver=6.1.7", "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-business/add-ons-pro/automatic-language-detection/assets/css/trp-popup.css?ver=1.1.2", "https://www.esailyachtsimulator.com/wp-content/plugins/mailchimp-for-wp/assets/css/form-themes.css?ver=4.14.1", "https://www.esailyachtsimulator.com/wp-content/themes/esail/dest/css/style.css?ver=1790801236", "https://www.esailyachtsimulator.com/wp-content/themes/esail/dest/css/font-awesome.min.css?ver=7.1.2", "https://fonts.googleapis.com/css?family=Open+Sans&ver=7.1.2", "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/css/trp-language-switcher-v2.css?ver=3.3.6", "https://cdnjs.cloudflare.com/ajax/libs/cookieconsent2/3.1.0/cookieconsent.min.css", "https://www.esailyachtsimulator.com/wp-content/plugins/watu/style.css?ver=2.3.8"], "text": "Learn To Sail with eSail – The Official Website of Virtual Sailing for PC & Mac\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\n“The most technically accurate sailing simulator\n\nI have experienced.”\n\nSIM UK\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nSupport\n\nHome\n\nThe World of eSail\n\nHow to Purchase\n\nLive Sailing & Sandbox\n\nSailing Challenges\n\nThe World of Shearwater\n\nLearn To Sail with eSail\n\nAbout Us\n\nVideos & Gallery\n\neSail Add-Ons\n\nMan Overboard\n\neSail Pro\n\nReviews\n\neSail News\n\nLearn To Sail with eSail\n\neSail works hand in hand with shore-based and practical courses:\n\nProvides a way of practising and refreshing skills\n\nIncludes ‘Learn Yachting with eSail’ with 17 detailed tutorials.\n\n5 advanced tutorials\n\nSailing skills such as reefing, mooring, charting and anchoring are included.\n\nWorks to support practical and theory training courses from organisations such as\n\nUS Sailing\n\nand the\n\nRYA\n\n. Note that eSail is not affiliated with or approved by any such organisation.\n\nIncludes challenges to master your skills, such as races, treasure hunts and steering challenges.\n\neSail can be enjoyed by beginners and competent sailors.\n\nCan be used in sailing classes by qualified instructors.\n\nWARNING. eSail is not a replacement for training with a qualified instructor. Never take a sailing boat out unless you are properly trained and qualified. Sailing in the real world can be physically and mentally demanding. These aspects cannot be replicated in a simulator. In addition the physics in any simulator cannot always replicate real life or any particular boat.\n\nThe tutorials take you on a virtual journey, during which you raise the sails, practice reefing, try mooring and learn good anchoring technique. eSail also includes a charting tool with plotter and dividers so you can try out navigation.\n\nFinally you arrive at sunset at Maxwell Marina, by which time you are familiar with handling your boat using sails and engine. Once you have completed the course you will be ready to navigate around the ‘legendary’ Shearwater Islands and voyage the high seas.\n\nAnd with the\n\nMan Overboard Add-On\n\nyou can learn\n\nMan Overboard\n\nskills with tutorials and challenges created in conjunction with Keith Cowell, the author of the\n\nRYA’s Sea Survival Handbook\n\n.\n\nThis is a full list of tutorials included:\n\nGetting Started\n\neSail Controls\n\nKnow Your Boat Challenge (Beginners)\n\nSteering Challenge – Buoy Course\n\nSteering Challenge – Into the Wind\n\nControl Lines, Winches and Jammers\n\nRaising the Mainsail\n\nAdjusting the Mainsail\n\nUnfurling and Adjusting the Jib\n\nTacking and Gybing\n\nReefing\n\nLowering the Sails\n\nAnchoring\n\nSail Hoisting Challenge\n\nNavigation\n\nMooring Alongside\n\nStern-to Mooring ( or ‘Mediterranean mooring’)\n\nAdvanced Tutorials\n\nSailing Quick Start\n\nHeaving-to\n\nSail Twist\n\nSail Depth\n\nAsymmetric Spinnaker\n\nMan Overboard Add On:\n\nMan Overboard Under Power\n\nMan Overboard Under Sail\n\neSail Pro Add On:\n\neSail Pro Features\n\nSpringing Off the Dock\n\nTidal Heights Introduction (V3)\n\nTidal Heights – Passing Under an Obstruction (V3)\n\n“eSail – The Sailing Simulator has raised the benchmark higher for comprehensive, fully detailed and exhaustively accurate Sailing education. Simply put the tutorials included here are brilliant!”\n\nSIM UK\n\nYour browser does not support the video tag.\n\neSail is available for Windows and Apple Mac\n\nJoin the eSail community now!\n\nHOW TO PURCHASE\n\n​\n\nYou can also take part in challenges including treasure hunts, races, steering and anchoring competitions. eSail is not really a racing game (although there are races), it’s software that aims to make you a better sailor. So all the challenges have a valid educational purpose. For instance, the treasure hunts help you develop steering and throttle control; the races give you a greater awareness of what is round you and the ability to multitask; the anchoring challenges help you assess the sea bed, wind and estimate the likely circle your boat will follow as the wind changes.\n\nSo eSail is the perfect tool for learning new skills, refreshing old skills and having fun in the process.\n\nYou might be interested in these sailing resources:\n\nYachting.com – boat charter, sailing courses and more..\n\nBasics of proper sail setting and trimming on a yacht\n\nMastering boat docking: Techniques and maintenance guide\n\nSailing Knots: Essential Guide for Sailors – Learn and Master Knot Tying\n\nA complete guide to boat anchors\n\nSound Signals On the Water\n\nSailing Terms\n\nSailing rules article\n\nHow Weather Works\n\nAmerican Sailing Association (ASA) New Sailor Resources\n\nPraktisk sejlads – underdrejet\n\nGT Sailing\n\nLearn to sail with eSail!\n\nUnlike other simulators which are mainly aimed at racing, eSail is designed to help you learn real sailing skills which can be transferred into the real world. And sailing instructors can use eSail to demonstrate specific techniques. For example, winding a line onto a winch correctly.\n\neSail has been designed to fill the gap between theory and practical training. Books, training manuals, classroom based or online courses are all essential tools, but nothing can beat being out on the water to really learn how to sail.\n\nBut for many people, the opportunities to sail yachts comes only once or twice a year on the annual vacation. eSail now provides a way of being out on the water, and enjoying learning new sailing skills while navigating the virtual seas.\n\nAnswer this sailing question…\n\nWhat speed is Beaufort Force 4?\n\n7-10 knots\n\n17-21 knots\n\n11-16 knots\n\nLaden …\n\nUSER POST 21 July 2021 (Sorel Mitra)\n\nI was also following a RYA course and preparing the theory for RYA Day Skipper before Covid hit. Ever since I’ve been only sim sailing and here’s what I’ve found after 170+ hours on eSail:\n\nI believe its real power comes not from its tutorials but from:\n\n– It really helps you wrap your mind around deck & cockpit activities. In my first hours on it I found it really difficult mental work to do all the actions for raising sails or reefing. I struggled a lot to remember the steps and what line to ease, let go, or pull. After many hours on eSail I’ve recently found that I now perform sail activities almost as a second nature: raise, reef, lower, tack, gybe, change headsail. I even managed to raise & adjust the newly added gennaker on my own w/o hitting the tutorial.\n\n– It helps understanding points of sail in a “practical” way – of course the sim boat is different from real boats, but then real boats also differ between each other so what I learned is that you need to adapt to your boat – the theory helps but what you need to do is watch and feel your boat and then I guess you’ll be able to do this on real boats as well. Initially I was trying to set the sails “by the book” and kept struggling with that. Once I started “feeling” the sim boat (watching what she does and remembering how sails work) I began being able to trim the sails to 1) gather a decent speed 2) steady the boat 3) avoid excessive helm – On certain points of sail I’m even able to take my hands off the helm (without autopilot!) and have the boat follow a course I chose\n\n– No tide or currents but I believe it has leeway so your course is altered by that. Also in heavy wind it’s quite difficult to maintain a steady course so go ahead and estimate your position if you can! Not sure yet if leeway is a thing but at least dead reckoning can be practiced – get out of any land sight, take a target in the middle of the ocean in lat/long coordinates and try to hit it without ever looking at your GPS. Estimate your position and once you believe you hit your target compare that with the sim GPS. As the Shearwater islands are at some coordinates in the Atlantic, you can use Open CPN for your chart work outside the coverage of the available sim charts.\n\n– Get used to estimating and plotting your position on the chart on the hour. Leave the sim running (perhaps with autopilot on, or for more challenge without it), go do your other activities and try not to forget to plot your EP on the chart (Open CPN or sim chart). Try to estimate the average speed and course. Do that for a few hours and then compare your EP with sim GPS – how far are you from that?\n\n– Pilotage. Draw your pilotage plan and follow it. This helps before you get to learn the islands by heart. Ignore the GPS/plotter and pilot your boat with your pilotage plan.\n\n– It helps build coordination. You do have “crew” but I feel more like I’m solo sailing where I need to hold the helm, adjust the sails, watch-out for that nasty ship that’s chasing you to run you down, keep an eye on the depth and so on.\n\n– It helps make you a decision maker. You’re in Virginia passage determined to beat to wind and the nasty ship appears ahead of you. Try not to run away with your engine and find a way to stay clear of that ship while still in control of your boat. Or you’re heading straight between two rocks believing you can pass between them and the depth is rapidly changing. You just stare at it as I did and run aground or do a last-minute tack or gybe to escape the danger?\n\n– It adds real value with mooring. I guess it’s not easy to get to practice mooring with real boats – there’s always the danger of hitting something. With the sim boat you don’t care and have a chance to learn the basics. I know real-life conditions are different but once you realize that it helps you get your head around mooring at a pontoon – the sim wind pushes you real hard and it has quite a few narrow places where you’ll find you need to balance your speed – too low and the wind pushes you around, too high and it’s hard to control the boat. Try mooring to a pontoon on the inside of Port Fogarty in 30kn of wind and you’ll see what I mean. Of course, don’t cheat by using different camera views. Stay at the helm and try to get a sense of the length of the boat, how she moves, how the wind pushes her – I think this helps with real boats in the same way people that learn how to drive cars make good use of car driving simulators.\n\nIn short I believe there’s nothing like being on a real boat, but lacking that, or if you’re mostly crewing instead of skippering that real boat, a simulator can help at least wrapping your mind around the usual skipper activities so when you hit that real boat at least you have the proper mindset.\n\neSail is available for Windows and Apple Mac.\n\nJoin the eSailing community now!\n\nHOW TO PURCHASE\n\nFollow Us\n\nSupport\n\nHow to Purchase\n\nRegistered Office:\n\nSuite 3 1-3 Warren Court Park Road, Crowborough, East Sussex, England, TN6 2QX\n\neSail ® is a registered trademark. © 2026 Copyright eSail Ltd.\n\nWhile all reasonable care has been taken in producing eSail the publisher can accept no responsibility for any errors or omissions or consequences of using any methods or processes described. The world and charts included in eSail are entirely fictional and must not be used for navigation.\n\nPrivacy Policy\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nChange Language\n\nClose and do not switch language\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλλη yachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/css/trp-language-switcher-v2.css?ver=3.3.6", "https://cdnjs.cloudflare.com/ajax/libs/cookieconsent2/3.1.0/cookieconsent.min.css"], "text": "The World of Shearwater – The Official Website of Virtual Sailing for PC & Mac\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\n“The most technically accurate sailing simulator\n\nI have experienced.”\n\nSIM UK\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nSupport\n\nHome\n\nThe World of eSail\n\nHow to Purchase\n\nLive Sailing & Sandbox\n\nSailing Challenges\n\nThe World of Shearwater\n\nLearn To Sail with eSail\n\nAbout Us\n\nVideos & Gallery\n\neSail Add-Ons\n\nMan Overboard\n\neSail Pro\n\nReviews\n\neSail News\n\nThe World of Shearwater\n\neSail brings to you the world of the Shearwater Islands located in the Mid Atlantic. The islands are formed by volcanic activity (the location is on the Mid Atlantic Ridge). In the late 20th Century, the British charted the main island and provided buoyage and lights.\n\nNOTE: the channel markers follow the British system with red to the port and green to the starboard as you enter the channel or harbour heading towards the land.\n\nThere is now also a new sailing area to the North of the main Shearwater group. You can navigate to these new islands using the recently published Chart B2 (available inside eSail). Discover points of interest (POIs) such as a lava flow, the fantastic double Golden Angel Falls and the Seismic Monitoring Station on the slopes of Mt. Mallory – an active volcano.\n\nWind in eSail\n\nLearn To Sail with eSail\n\nThe World of eSail\n\nOver the years there has been some industrial activity, in particular with the islands being used as oil storage facility for shipping. However, most of the islands are completely unspoilt, with numerous bays for anchoring and and enjoying the wildlife…\n\nBeing strategically located, the islands have changed hands many times. The Spanish, British, Americans and Italians have all left their mark – the latter building the folly known as Little Venice. This town has many buildings virtually identical to those found in the real Venice. The builders have thoughtfully created canals large enough to sail along with few bridges, so you can motor, sail and even race along the watery streets!\n\neSail is available for Windows and Apple Mac.\n\nJoin the eSailing community now!\n\nHOW TO PURCHASE\n\nFollow Us\n\nSupport\n\nHow to Purchase\n\nRegistered Office:\n\nSuite 3 1-3 Warren Court Park Road, Crowborough, East Sussex, England, TN6 2QX\n\neSail ® is a registered trademark. © 2026 Copyright eSail Ltd.\n\nWhile all reasonable care has been taken in producing eSail the publisher can accept no responsibility for any errors or omissions or consequences of using any methods or processes described. The world and charts included in eSail are entirely fictional and must not be used for navigation.\n\nPrivacy Policy\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nChange Language\n\nClose and do not switch language\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nChange Language\n\nClose and do not switch language"}, {"url": "https://www.esailyachtsimulator.com/the-world-of-esail/wind/", "title": "Wind in eSail – The Official Website of Virtual Sailing for PC & Mac", "text_file": "pages/the-world-of-esail__wind/text.txt", "html_file": "pages/the-world-of-esail__wind/source.html", "characters": 5608, "images": [{"url": "https://www.esailyachtsimulator.com/wp-content/uploads/2018/11/esail-logo-e1544715402327.png", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/uploads/2025/04/Lake.jpg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/en_US.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/fr_FR.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/de_DE.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/tr_TR.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/es_ES.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/pt_PT.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/pt_BR.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/el.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/it_IT.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/nl_NL.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/uploads/2019/03/star.png", "alt": ""}], "stylesheets": ["https://www.esailyachtsimulator.com/wp-content/plugins/contact-form-7/includes/css/styles.css?ver=6.1.7", "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-business/add-ons-pro/automatic-language-detection/assets/css/trp-popup.css?ver=1.1.2", "https://www.esailyachtsimulator.com/wp-content/plugins/mailchimp-for-wp/assets/css/form-themes.css?ver=4.14.1", "https://www.esailyachtsimulator.com/wp-content/themes/esail/dest/css/style.css?ver=1790809673", "https://www.esailyachtsimulator.com/wp-content/themes/esail/dest/css/font-awesome.min.css?ver=7.1.2", "https://fonts.googleapis.com/css?family=Open+Sans&ver=7.1.2", "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/css/trp-language-switcher-v2.css?ver=3.3.6", "https://cdnjs.cloudflare.com/ajax/libs/cookieconsent2/3.1.0/cookieconsent.min.css"], "text": "Wind in eSail – The Official Website of Virtual Sailing for PC & Mac\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\n“The most technically accurate sailing simulator\n\nI have experienced.”\n\nSIM UK\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nSupport\n\nHome\n\nThe World of eSail\n\nHow to Purchase\n\nLive Sailing & Sandbox\n\nSailing Challenges\n\nThe World of Shearwater\n\nLearn To Sail with eSail\n\nAbout Us\n\nVideos & Gallery\n\neSail Add-Ons\n\nMan Overboard\n\neSail Pro\n\nReviews\n\neSail News\n\nWind in eSail\n\nHow the weather works in eSail:\n\nMultiple pressure systems control the weather.\n\nNEW V3 wind is affected by the shape of the land (strength controlled by Settings).\n\nNEW V3 localised sea breezes can be seen on the water surface, so sailors can aim for the best areas for stronger wind.\n\nNEW V3 variability in wind speed and direction (controlled in Settings).\n\nNEW V3 wind funnels between islands (controlled in Settings).\n\nPressure\n\nAcross the globe, pressure systems build due to uneven heating. Because air is a fluid, just like water (and obeys the same physical laws) it seeks to flow from regions of high pressure to areas of lower pressure. On a global scale the cooler, denser polar air is constantly moving towards the equator to replace the warm, rising air. This movement, combined with the Earth’s rotation forms wind belts, circling the Earth. One of these bands is the Intertropical Convergence Zone near the equator. This is where the trade winds form, named due to their fairly dependable behaviour for sailing.\n\nIn addition to the global wind currents, there are cyclones (depressions) and anticyclones (high pressure systems). As these systems traverse the Earth the wind direction and speed moves in a fairly predictable manner. A series of these pressure systems are modelled in eSail. They move across the Shearwater area in a SW to NE direction. The eSail wind speed is sensitive to changes in pressure, so a falling barometer (available in eSail Pro) can be a useful indication of stronger winds.\n\nLocal wind\n\nMore local wind conditions can be formed by the shape and proximity of nearby land. During the day, the land warms, air rises and moves from the sea to the land (anabatic wind). The process reverses at night where the sea may be warmer than the rapidly cooling land. In this case the air moves down the slopes towards the sea (katabatic wind).\n\nSea breezes\n\nIn eSail the islands are too small to form predictable anabatic or katabatic winds. However, patchy anabatic sea breezes do form (new in eSail V3). You can identify areas of stronger wind by the patches of water with less reflection (caused by small ripples). These patches are easier to spot from a distance. As you get closer the effect on the water is much less noticeable, but you should see an increase in wind speed and sometimes a shift in wind direction. The effect is more pronounced at lower wind speeds. In fact with any wind over 25 knots you will not see much difference.\n\nThe shape of land can also affect the wind direction. This is modelled in eSail (from V3). If the wind is coming over a nearby island, as you sail towards a headland, the wind will often shift, as the wind flows around the island. If you are close hauled this can be frustrating as it can bring the wind direction straight onto your bow. In this case, just tack away from the land. Once you are a few hundred metres off shore the wind should revert to its previous direction. The strength of the effect can be adjusted in Settings (although it is set during challenges).\n\nFrom eSail V3 winds are variable (depending on Settings) in speed and direction. The gusts cause direction changes for short periods: “In open water in the Northern Hemisphere the wind will veer clockwise, and the amount of change in direction is largely dictated by the strength of the gust, but is likely to be in the order of 15° to 20°. In the Southern Hemisphere, the veer direction is anticlockwise.” Yachting Monthly (\n\nHow to cope with gusts and squalls\n\n). Periods of variability are more frequent close to land. Out in open water gusty, variable wind happens less often (but when it does it can be more extreme!)\n\nIn addition to all these interesting wind features, from eSail V3 the wind funnels between close islands, providing some challenging conditions in stronger winds.\n\neSail is available for Windows and Apple Mac.\n\nJoin the eSailing community now!\n\nHOW TO PURCHASE\n\nFollow Us\n\nSupport\n\nHow to Purchase\n\nRegistered Office:\n\nSuite 3 1-3 Warren Court Park Road, Crowborough, East Sussex, England, TN6 2QX\n\neSail ® is a registered trademark. © 2026 Copyright eSail Ltd.\n\nWhile all reasonable care has been taken in producing eSail the publisher can accept no responsibility for any errors or omissions or consequences of using any methods or processes described. The world and charts included in eSail are entirely fictional and must not be used for navigation.\n\nPrivacy Policy\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItal
