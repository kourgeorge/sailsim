aphics, advanced wind and new sailing areas with tidal variations!\n\nFor beginners\n\nyou learn how to sail a 36′ sailing yacht including raising the sail, tacking, gybing, reefing, mooring and anchoring.\n\nFor experts\n\nyou can use the Quick Start tutorial then dive straight into the challenges.\n\nYou can then explore the waters surrounding the Shearwater Islands and seek out features such as the wreck of the Princess Zara, and join challenges such as sailing races and collision avoidance.\n\nYour browser does not support the video tag.\n\n“There is a vast amount to explore and learn, the thought processes and actions required to sail your virtual boat are remarkably close to the real world.”\n\nYACHTING MONTHLY\n\nLanguages:\n\nEnglish, Deutsch, Français, Türkçe, Español, Ελληνικά, Italiano, Nederlands, Brazilian Portuguese (V3)\n\nThe\n\nMan Overboard Add-on\n\ndeveloped with Keith Colwell, author of the\n\nRYA Sea Survival Handbook\n\nfeatures tutorials, challenges and random triggering of MOB during normal sailing.\n\nMore…\n\nThe\n\neSail Pro Add-on\n\nfeatures advanced sailing instruments, mooring sandbox, mooring under sail and\n\nmore…\n\neSail is available for Windows and Apple Mac\n\nJoin the eSail community now!\n\nHOW TO PURCHASE\n\nLearn Yachting with eSail\n\nA learning programme with 17 modules covering from using the eSail controls, through to raising the mainsail, tacking, gybing and more. Use to learn to sail alongside\n\nRYA\n\n,\n\nUS Sailing\n\nor other certificated training schemes. Note that eSail is not affiliated with or approved by any such organisation.\n\nWe also have 5 advanced tutorials covering sail twist, sail depth and more, so you can squeeze every bit of speed from your virtual sailing boat. The tutorials are voiced by the amazing Hannah White, the Guinness Book of Records holder for the fastest sailing dinghy crossing of the English Channel.\n\nMore\n\nMultiplayer Live Sailing\n\nWith Live Sailing you weigh anchor, set sail and explore the seas and ocean around the Shearwater islands! Your goal is to collect ‘Points of Interest’ (POIs). If you collect all 13 you achieve ‘Master Explorer’ status.\n\nConstantly changing weather with hourly forecasts\n\n‘VHF’ chat with other boats\n\nSave your position\n\nMultiplayer challenges\n\nMore\n\nCharting & Night Sailing\n\nTo the best of our knowledge eSail is the only yacht simulator to include a charting module which enables basic navigation such as plotting a course using dividers and other charting tools. ​Use the chart and the\n\nlights from buoys and lighthouses\n\nto navigate.\n\nSailing Challenges\n\n15 challenges including Bear Island Race, Little Venice Treasure Hunt (sail through canals), collision avoidance and passage planning exercises and sailing games.\n\nMore\n\n“eSail – The Sailing Simulator has raised the benchmark higher for comprehensive, fully detailed and exhaustively accurate Sailing education. Simply put the tutorials included here are brilliant!”\n\nSIM UK\n\neSail Challenges & Quick Quiz\n\nVideos and Gallery\n\nReviews\n\nLearn to Sail\n\neSail is available for Windows and Apple Mac\n\nJoin the eSail community now!\n\nHOW TO PURCHASE\n\nBear Island Race - Top 5 best sailing sim scores\n\nRank\n\nName\n\nScore\n\n1\n\nPrinceTrogdor\n\n0:06:54.155\n\n2\n\nstian.dorre\n\n0:07:05.331\n\n3\n\nplabow\n\n0:07:10.075\n\n4\n\nalex.newman\n\n0:07:36.13\n\n5\n\nchoeller2\n\n0:07:43.236\n\n“If you’re new to sailing this is a fantastic way to learn at home and brush up skills. If you’re an experienced sailor then it’s still great fun and adventures can be had navigating around using charts or sailing through challengingly tight spaces!”\n\nPractical Boat Owner\n\nMore\n\nFollow Us\n\nSupport\n\nHow to Purchase\n\nRegistered Office:\n\nSuite 3 1-3 Warren Court Park Road, Crowborough, East Sussex, England, TN6 2QX\n\neSail ® is a registered trademark. © 2026 Copyright eSail Ltd.\n\nWhile all reasonable care has been taken in producin  automated devices will be void.\n\nNo responsibility can be accepted for entries lost, delayed or corrupted, or due to computer error in transit or due to eSail software or server failures or failures of any eSail supplier.\n\nChallenge places are always limited. No responsibility will be accepted if there are not enough places for everyone. Places are offered on a first come first served basis.\n\nThe finishing positions will be calculated by eSail software and eSail servers. These positions may differ from the positions as viewed by competitors.\n\nThe prizes are as stated, are not transferable to another individual and no cash or other alternatives will be offered.\n\nThe promoters reserve the right to amend or alter the terms of competitions and reject entries or deduct points from entrants not entering into a spirit of fair competition.\n\nIn the event of a prize being unavailable, the promoter reserves the right to offer an alternative prize of equal or greater value.\n\nThe winner(s) agree(s) to the use of their Steam name and country being used for publicity purposes.\n\nReasonable efforts will be made to contact the winner(s). If the winner(s) cannot be contacted, or are unable to comply with these terms and conditions, the Promoter reserves the right to offer the prize to the runner(s)-up selected by the same judges.\n\nFailure to respond and/or provide an address for delivery, or failure to meet the eligibility requirements may result in forfeiture of the prize.\n\nThe decision of the judges is final and no correspondence will be entered into over this decision. Competitions may be modified or withdrawn at any time.\n\nOnly the Steam name and country of the winners will be disclosed.\n\neSail\n\nPosted in\n\neSail Community News\n\nFollow Us\n\nSupport\n\nHow to Purchase\n\nRegistered Office:\n\nSuite 3 1-3 Warren Court Park Road, Crowborough, East Sussex, England, TN6 2QX\n\neSail ® is a registered trademark. © 2026 Copyright eSail Ltd.\n\nWhile all rea he Official Website of Virtual Sailing for PC & Mac\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\n“The most technically accurate sailing simulator\n\nI have experienced.”\n\nSIM UK\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nSupport\n\nHome\n\nThe World of eSail\n\nHow to Purchase\n\nLive Sailing & Sandbox\n\nSailing Challenges\n\nThe World of Shearwater\n\nLearn To Sail with eSail\n\nAbout Us\n\nVideos & Gallery\n\neSail Add-Ons\n\nMan Overboard\n\neSail Pro\n\nReviews\n\neSail News\n\neSail Community News\n\neSail Development\n\neSail Reviews\n\neSail Updates\n\nFeatured\n\nChris Baldwin\n\nBest Sailing Sim Tutorial EVER!! | Sim UK Review\n\n(1st May 2018) Today we received our first video review which was pretty good! Lots of great observations in this video.\n\nSIM UK FULL REVIEW\n\n​\n\neSail – Sailing Simulator has raised the benchmark higher for comprehensive, fully detailed and exhaustively accurate Sailing education. Simply put the tutorials included here are brilliant!\n\n(See https://store.steampowered.com for the review with a table showing all the Sim UK ratings).\n\n== PRO ==\n\n– The tutorials are just excellent. So much detail, so accurate and so well explained.\n\n– The crew animation; when you see them hard at work…it really works.\n\n– Environment, good layout and variety.\n\n– Mooring. Yes! This game fully models and teaches mooring!\n\n– Charts and plotting, nicely done & adds a yet another layer of realism to proceedings.\n\n– Physics on the most part are good, authentic and believable.\n\n– Dropping and weighing anchor! (Including a Full tutorial).\n\n– Ship damage…Not fully implemented (don’t think you can sink yet).\n\n– Challenges & Races + More!\n\n== CON ==\n\n– Ocean does not look as realistic as other similar titles, it’s OK but not brilliant.\n\n– Graphically it is OK, but other similar titles have stronger graphical eye candy.\n\n– You cannot (currently) Issue commands to both crewmembers at the same time.\n\n– Some audio is out of sync with animation (Winches).\n\n== OVERVIEW ==\n\nUnquestionably this is the most comprehensive sailing tutorial I have ever experienced. It is certainly good enough to teach new and existing sailors all the most important & fundamental skills for yacht sailing.\n\nIf there are no plans to expand this title as a professional tool for teaching then it should be considered because they have managed the entire tutorial aspect brilliantly. It is well explained, detailed and even the timing seems spot on.\n\nThis game is unique, I am glad to say. The way in which the crew are animated is so clever. I must admit I wasn’t too keen at first but when you make that first Jibe and the crew are working frantically to keep the lines trimmed it suddenly feels very realistic and extremely authentic; just brilliant.\n\nI highly recommend this title even whilst it is EA, it is already very accomplished.\n\n== what I’d Like to See ==\n\nI’d like to see better sea animation and graphics across the board, that’s not to say it is bad however. Other similar sailing games recently released do look better but lack so much content in comparison to this title, so it is 6 of one and half a dozen of the other. If eSail could improve the sea animation I think it would have it all.\n\nI would also like to see more ocean / landmass to explore. The entire planet would be excellent but unlikely. Perhaps the release of detailed sailing hotspots and Points of Interest DLC’s could ensure this game continues to develop and expand over time.\n\nAt present there is just a single 36’ sailing yacht, obvious I’d like to see a variety of boats we can jump on and learn how to master.\n\nLots more is planned from this development team and I cannot wait to see what.\n\neSail\n\nPosted in\n\neSail Reviews\n\nFollow Us\n  help you get the best out of eSail.\n\nA 15 gallon refillable fuel tank. Filling is via a pump at Port Fogarty in the South of Shearwater island.\n\nRev Counter, Fuel gauge and Barometer (V3).\n\nAdvanced wind indicator showing apparent and true wind direction and speed.\n\nMooring Sandbox which enables you to practise and save a mooring scenario. Like the standard Sandbox you can modify wind direction and speed.\n\nAdvanced autopilot enabling precise control and modification of your bearing.\n\nThe autopilot can also be set to maintain your angle to the wind. This is very useful in race situations as well as general sailing. For instance, once you have set your trim for a certain angle to the wind, after tacking you can quickly set your boat onto the exact bearing to work with your trim.\n\nTrue and apparent wind modes. Selecting true wind mode will give the autopilot better stability when running downwind.\n\nThe ability to change your shore mooring cleat, ideal for tight mooring situations and springing off the dock.\n\nMooring using just the central boat cleat.\n\nThe ability to moor under sail. (It is also possible to now leave a jetty under sail). These techniques are very useful if you are unfortunate enough to run out of fuel – something that is possible with eSail Pro!\n\nTwo advanced tutorials covering ‘Springing Off the Dock’ and the eSail Pro features.\n\nTidal Heights Introduction tutorial (V3)\n\nTidal Heights – Passing Under an Obstruction tutoral (V3)\n\nInteractive tidal curve\n\nNOTE: eSail Pro is currently available in English, French, German, Spanish, Italian, Greek, Dutch and Brazilian Portuguese (V3).\n\nShare\n\neSail is available for Windows and Apple Mac.\n\nJoin the eSailing community now!\n\nHOW TO PURCHASE\n\nFollow Us\n\nSupport\n\nHow to Purchase\n\nRegistered Office:\n\nSuite 3 1-3 Warren Court Park Road, Crowborough, East Sussex, England, TN6 2QX\n\neSail ® is a registered trademark. © 2026 Copyright eSail Ltd.\n\nWhile all reasonable care has been taken in producing eSail the publisher can accept no responsibility for any errors or omissions or consequences of using any methods or processes described. The world and charts included in eSail are entirely fictional and must not be used for navigation.\n\nPrivacy Policy\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nChange Language\n\nClose and do not switch language\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nChange Language\n\nClose and do not switch language"}, {"url": "https://www.esailyachtsimulator.com/esail-addons/man-overboard/", "title": "Man Overboard – The Official Website of Virtual Sailing for PC & Mac", "text_file": "pages/esail-addons__man-overboard/text.txt", "html_file": "pages/esail-addons__man-overboard/source.html", "characters": 4559, "images": [{"url": "https://www.esailyachtsimulator.com/wp-content/uploads/2018/11/esail-logo-e1544715402327.png", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/uploads/2020/01/Man-overboard-recovery-3-1917x500.jpg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/uploads/2019/12/Main-capsule.png", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/uploads/2020/01/Man-overboard-2.jpg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/en_US.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/fr_FR.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/de_DE.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/tr_TR.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/es_ES.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/pt_PT.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/pt_BR.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/el.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/it_IT.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/nl_NL.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/uploads/2019/03/star.png", "alt": ""}], "stylesheets": ["https://www.esailyachtsimulator.com/wp-content/plugins/contact-form-7/includes/css/styles.css?ver=6.1.7", "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-business/add-ons-pro/automatic-language-detection/assets/css/trp-popup.css?ver=1.1.2", "https://www.esailyachtsimulator.com/wp-content/plugins/mailchimp-for-wp/assets/css/form-themes.css?ver=4.14.1", "https://www.esailyachtsimulator.com/wp-content/themes/esail/dest/css/style.css?ver=1790808244", "https://www.esailyachtsimulator.com/wp-content/themes/esail/dest/css/font-awesome.min.css?ver=7.1.2", "https://fonts.googleapis.com/css?family=Open+Sans&ver=7.1.2", "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/css/trp-language-switcher-v2.css?ver=3.3.6", "https://cdnjs.cloudflare.com/ajax/libs/cookieconsent2/3.1.0/cookieconsent.min.css"], "text": "Man Overboard – The Official Website of Virtual Sailing for PC & Mac\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\n“The most technically accurate sailing simulator\n\nI have experienced.”\n\nSIM UK\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nSupport\n\nHome\n\nThe World of eSail\n\nHow to Purchase\n\nLive Sailing & Sandbox\n\nSailing Challenges\n\nThe World of Shearwater\n\nLearn To Sail with eSail\n\nAbout Us\n\nVideos & Gallery\n\neSail Add-Ons\n\nMan Overboard\n\neSail Pro\n\nReviews\n\neSail News\n\nMan Overboard Add-on\n\nThis new add-on from eSail has been developed with Keith Colwell (\n\nRYA Sea Survival Handbook\n\n) to help you practise your man overboard (MOB) drill. It includes tutorials, challenges and random triggering of MOB during normal sailing.\n\nMOB Quick Stop Method (Under Power) tutorial:\n\nHeaving-to, triggering a DSC alert, deploying the danbuoy & horseshoe lifebuoy and returning to the casualty under power.\n\nMOB Quick Stop Method (Under Sail) tutorial:\n\nAs above but making a figure-of-eight turn then recovering the MOB under sail.\n\nLive Sailing mode with randomly trigger man overboard. This is a great way of building your ability to react in the correct way during an emergency.\n\nChallenges are provided for man overboard where you can pit your skills against other eSail users. There is a choice of ‘Under Power’ and ‘Under Sail’.\n\nWARNING. eSail Man Overboard is not a replacement for training with a qualified instructor. Man Overboard recovery MUST be practiced on a real boat with a qualified instructor. Never take a sailing boat out unless you are properly trained and qualified. Sailing in the real world can be physically and mentally demanding. These aspects cannot be replicated in a simulator. In addition the physics in any simulator cannot always replicate real life or any particular boat.\n\nIMPORTANT NOTES\n\nThe technique used is the Quick Stop/Heaving-to method, followed by a figure-of-eight (when under sail) then picking up the MOB on the leeward side of the boat. For consistency with real world training, the man overboard is represented by a fender and bucket. Recovery is by using a boathook. The training does not cover recovery methods likely to be used to bring a real person back on board as these are very boat specific. The add-on does not in any way replace training and practise on a real boat.\n\nThe add-on is intended for eSailors of intermediate or advanced level.\n\nMan Overboard was created in close collaboration with Keith Colwell. Keith trained as a naval architect then after a 22-year career as a staff boating journalist testing boats and equipment, Keith made a career change and joined the Royal National Lifeboat Institution (RNLI) as a Sea Safety Manager.\n\nDuring his 15 years with the RNLI, Keith trained and managed RNLI Sea Safety and Community Safety volunteers to give advice to yachtsmen, boat users and the general public on how to stay safe when on or by the water. He became a RYA sea survival, powerboat and marine vhf radio instructor/assessor in 2004, while working for the RNLI, and currently works as a freelance instructor.\n\nHe is the author of the internationally-published\n\nRYA Sea Survival Handbook\n\nand the RYA Boat Safety Handbook and continues to write for PBO magazine as their sea safety correspondent.\n\nShare\n\neSail is available for Windows and Apple Mac.\n\nJoin the eSailing community now!\n\nHOW TO PURCHASE\n\nFollow Us\n\nSupport\n\nHow to Purchase\n\nRegistered Office:\n\nSuite 3 1-3 Warren Court Park Road, Crowborough, East Sussex, England, TN6 2QX\n\neSail ® is a registered trademark. © 2026 Copyright eSail Ltd.\n\nWhile all reasonable care has been taken in producing eSail the publisher can accept no responsibility for any errors or omissions or consequences of using any methods or processes descr ns/translatepress-business/add-ons-pro/automatic-language-detection/assets/css/trp-popup.css?ver=1.1.2", "https://www.esailyachtsimulator.com/wp-content/plugins/mailchimp-for-wp/assets/css/form-themes.css?ver=4.14.1", "https://www.esailyachtsimulator.com/wp-content/themes/esail/dest/css/style.css?ver=1790804844", "https://www.esailyachtsimulator.com/wp-content/themes/esail/dest/css/font-awesome.min.css?ver=7.1.2", "https://fonts.googleapis.com/css?family=Open+Sans&ver=7.1.2", "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/css/trp-language-switcher-v2.css?ver=3.3.6", "https://cdnjs.cloudflare.com/ajax/libs/cookieconsent2/3.1.0/cookieconsent.min.css"], "text": "eSail Sailing Simulator V3 launched – The Official Website of Virtual Sailing for PC & Mac\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\n“The most technically accurate sailing simulator\n\nI have experienced.”\n\nSIM UK\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nSupport\n\nHome\n\nThe World of eSail\n\nHow to Purchase\n\nLive Sailing & Sandbox\n\nSailing Challenges\n\nThe World of Shearwater\n\nLearn To Sail with eSail\n\nAbout Us\n\nVideos & Gallery\n\neSail Add-Ons\n\nMan Overboard\n\neSail Pro\n\nReviews\n\neSail News\n\neSail Community News\n\neSail Development\n\neSail Reviews\n\neSail Updates\n\nFeatured\n\nChris Baldwin\n\neSail Sailing Simulator V3 launched\n\n(May 12 2026) eSail Sailing Simulator V3 has been released today bringing significant advances in realistic virtual sailing. Originally launched in 2018, eSail includes a complete learning program ‘Learn Yachting with eSail’ with tutorials ranging from “Raising the Mainsail” to “Tidal Heights – Passing Under an Obstruction” in eSail Pro. Here you can try sailing under a low bridge to check if you have calculated the tide height correctly. eSail can be purchased through Steam or direct through esailsailingsimulator.com\n\nBeyond structured learning, the simulator offers multiplayer ‘Live Sailing,’ racing, numerous challenges and dedicated ‘Sandbox’ modes for experimenting with mooring and anchoring techniques.\n\nThe latest update brings:\n\nAtmospheric Modelling: Wind direction, speed and variability now account for land topography. This simulates complex real-world effects such as sea breezes and wind funnelling between islands. These localised breezes are visually represented on the water’s surface, allowing sailors to identify and navigate toward areas of higher wind speeds.\n\nNew ‘Trade Islands’: This new sailing area incorporates variable tidal heights, specifically designed for practising navigation over sand bars or under bridges where vertical clearance is a critical factor. The islands introduce 10 new points of interest (POIs) to find, leading to the advanced Tidal Explorer achievement.\n\neSail Pro Enhancements: The professional add-on now includes an interactive tidal curve tool and two dedicated tutorials focusing on tidal height calculations.\n\nGraphics Engine Updates: Version 3 features significantly enhanced graphics and numerous improvements to the functionality and user interface.\n\nA Comprehensive Learning Environment\n\nThe simulator’s emphasis on procedural accuracy has shown practical benefits in real-world scenarios. Graham, a sailor from Kirkcudbright, utilised his experience with the eSail ‘Man Overboard’ (MOB) add-on during an actual emergency. “I find eSail MOB particularly useful for practising ‘the drill,'” Graham noted. “Having done it so many times on eSail, I was much happier when the time came (in real life).”\n\nAbout eSail\n\neSail is built on a physics-based engine that calculates sail force and hull resistance in real-time, responding to changing wind conditions and sea states. With a global community of users, it is used by novice sailors for basic skill acquisition and more experienced mariners for practising technique, as well as for entertainment through its numerous challenges and races.\n\neSail\n\nPosted in\n\neSail Updates\n\n,\n\nFeatured\n\nFollow Us\n\nSupport\n\nHow to Purchase\n\nRegistered Office:\n\nSuite 3 1-3 Warren Court Park Road, Crowborough, East Sussex, England, TN6 2QX\n\neSail ® is a registered trademark. © 2026 Copyright eSail Ltd.\n\nWhile all reasonable care has been taken in producing eSail the publisher can accept no responsibility for any errors or omissions or consequences of using any methods or processes described. The world and charts included in eSail are entirely fictional and must not be used for navigation.\n\nPrivacy Policy\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nChange Language\n\nClose and do not switch language\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nChange Language\n\nClose and do not switch language"}, {"url": "https://www.esailyachtsimulator.com/esail-segelsimulator-die-deutsche-version/", "title": "eSail Segelsimulator – die deutsche Version – The Official Website of Virtual Sailing for PC & Mac", "text_file": "pages/esail-segelsimulator-die-deutsche-version/text.txt", "html_file": "pages/esail-segelsimulator-die-deutsche-version/source.html", "characters": 2940, "images": [{"url": "https://www.esailyachtsimulator.com/wp-content/uploads/2018/11/esail-logo-e1544715402327.png", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/uploads/2020/05/CAPSULE_cover_announcement_GER.png", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/w  4th February 2024. The Maritime Museum is the official home of the Australia II yacht with the museum being purpose built to house this Western Australian icon.\n\nThe sailing yacht and race trophy, alongside other victorious memorabilia, will be on display during the exhibition. eSail will be alongside to help inspire the next generation of sailors to learn to sail.\n\nWe are deeply honoured to be involved in such a momentous occasion and hope any eSailors in the area can attend.\n\nThe Museum of Western Australia\n\neSail\n\nPosted in\n\neSail Community News\n\nFollow Us\n\nSupport\n\nHow to Purchase\n\nRegistered Office:\n\nSuite 3 1-3 Warren Court Park Road, Crowborough, East Sussex, England, TN6 2QX\n\neSail ® is a registered trademark. © 2026 Copyright eSail Ltd.\n\nWhile all reasonable care has been taken in producing eSail the publisher can accept no responsibility for any errors or omissions or consequences of using any methods or processes described. The world and charts included in eSail are entirely fictional and must not be used for navigation.\n\nPrivacy Policy\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nChange Language\n\nClose and do not switch language\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nChange Language\n\nClose and do not switch language"}, {"url": "https://www.esailyachtsimulator.com/esail-update-1-5-39/", "title": "eSail Update 1.5.39 – The Official Website of Virtual Sailing for PC & Mac", "text_file": "pages/esail-update-1-5-39/text.txt", "html_file": "pages/esail-update-1-5-39/source.html", "characters": 2630, "images": [{"url": "https://www.esai OUNT…\n\n.\n\nFollow the instructions to create an account.\n\nNOTE: Your account name must not contain any spaces.\n\nYou may be asked for a Steam Guard code during the process. This is a code generated by Steam and sent to you by email. Do not confuse this with the license key you are sent by eSail. If you do not receive it please check your email junk folder.\n\nIMPORTANT: If you have difficulties with the CAPTCHA please see\n\nInstallation Technical Support Guide\n\nor contact\n\nSupport\n\n.\n\n3. Activate eSail by using your eSail license key\n\nStart the Steam Software on your computer. Click on ADD A GAME, (bottom left of the Steam software screen), then ‘Activate a product on Steam’. Follow the instructions to activate eSail. Your license key (Product Code) has been sent to you by email. Make sure you add any add-ons you have purchased in the same way.\n\nNOTE: If you have purchased add-ons, activate the main eSail Sailing Simulator license key first. Once installed, any add-ons can be found inside eSail when launched. They are not seen as separate ‘games’ in your Steam library.\n\n4. Download eSail\n\nAfter successful code verification go to the Library/Games section in your Steam software and install eSail. Information on any add-ons can be found in the Quick Start / Advanced Tutorials section.\n\neSail is available for Windows and Apple Mac.\n\nJoin the eSailing community now!\n\nHOW TO PURCHASE\n\nFollow Us\n\nSupport\n\nHow to Purchase\n\nRegistered Office:\n\nSuite 3 1-3 Warren Court Park Road, Crowborough, East Sussex, England, TN6 2QX\n\neSail ® is a registered trademark. © 2026 Copyright eSail Ltd.\n\nWhile all reasonable care has been taken in producing eSail the publisher can accept no responsibility for any errors or omissions or consequences of using any methods or processes described. The world and charts included in eSail are entirely fictional and must not be used for navigation.\n\nPrivacy Policy\n\nWe've detected you might be speaking a di  sailing simulator\n\nI have experienced.”\n\nSIM UK\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nSupport\n\nHome\n\nThe World of eSail\n\nHow to Purchase\n\nLive Sailing & Sandbox\n\nSailing Challenges\n\nThe World of Shearwater\n\nLearn To Sail with eSail\n\nAbout Us\n\nVideos & Gallery\n\neSail Add-Ons\n\nMan Overboard\n\neSail Pro\n\nReviews\n\neSail News\n\neSail Community News\n\neSail Development\n\neSail Reviews\n\neSail Updates\n\nFeatured\n\nChris Baldwin\n\nNEW eSail Sailing Simulator V2 released!\n\n(Jul 29th 2021) eSail V2 represents over a year’s development work and introduces a whole new virtual sailing experience. Here is a full list of major new features:\n\nMultiplayer. Now users can interact with each other in multiplayer Live Sailing. As before you are subject to the ever changing Shearwater weather, but now you can ‘VHF’ chat to other eSailors and take part in races against other boats. VHF chat is similar to real VHF in that it is possible to talk over other radio users, so you need to follow some protocols (which are explained in the simulator).\n\nNew languages added by our amazing community translators – Turkish, Spanish, Portuguese, Greek, Italian, Dutch (existing languages are English, French, Russian and German). All languages are subject to constant update and improvement, so please contact us if have feedback or can add anything.\n\nLive Sailing Courses. Here you can create your own courses including race courses and passages. Once you have a course you can set up private races by simply sending friends or other boats an access code.\n\nMultiplayer races. Join in with regular eSail multiplayer races. These will be added depending on demand so just let us know the best times and we will do our best to create challenges for you!\n\neSail Server. You can now get information about the status of the Shearwater world including the weather/forecast and the location of other boats, race results etc. by going straight to our server web page: https://esail-server-ui.herokuapp.com/\n\nAsymmetric spinnaker. This sail is great for everything from a beam reach to running downwind. The ‘asy’ is deployed in a snuffer, and when released tends to lift the bow giving higher boat speeds (in the right wind). Using the asymmetric you can exceed hull speed and plane. See the Advanced Tutorial for details on how to deploy and handle the sail.\n\nSandbox. This is a fantastic way of getting the best from your eSail boat. You can set wind direction & strength and wave height, then adjust your sails to match. If you note down the best trim this can give a real advantage when racing!\n\nNew Settings options:\n\nDetailed sky giving more realistic atmospheric effects such as ‘god rays’.\n\nProp walk so you can set how the propeller affects how the stern is kicked sideways in reverse. This is really useful when practising mooring.\n\nPhysics priority. This helps tune eSail to match the capabilities of your machine.\n\nMultiplayer mode, including the option to set time to +12 hours (so you don’t have to sail in the dark!)\n\nNew music and option to turn music off.\n\nOther enhancements include:\n\nBetter boat detailing, including new textures on the sail bag and hull.\n\nDeck and cabin lights making night sailing easier.\n\nBetter modelling of heel, so it is actually possible to broach or capsize under extreme conditions.\n\nF11 to toggle user interface on and off.\n\neSail version 2 has been extensively Beta tested, but it is just the start of the V2 development roadmap, so please report any issues experienced. We will fix these as quickly as possible in future updates as well as adding more exciting new features!\n\neSail V2 trailer\n\nHow to Purchase\n\neSail\n\nPosted in\n\neSail Community News\n\nFollow Us\n\nSupport\n\nHow to Purchase\n\nRegistered Office:\n\nSuite 3 1-3 Warren Court Park Road, Crowborough, East Sussex, England, TN6 2QX\n\neSail ® is a registered trademark. © 2026 Copyright eSail Ltd.\n\nWhile all reasonable care has been taken in producing eSail the publisher can accept no responsibility for any errors or omissions or consequences of using any methods or processes described. The world and charts included in eSail are entirely fictional and must not be used for navigation.\n\nPrivacy Policy\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nChange Language\n\nClose and do not switch language\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nChange Language\n\nClose and do not switch language"}, {"url": "https://www.esailyachtsimulator.com/live-sailing/", "title": "Live Sailing & Sandbox – The Official Website of Virtual Sailing for PC & Mac", "text_file": "pages/live-sailing/text.txt", "html_file": "pages/live-sailing/source.html", "characters": 4255, "images": [{"url": "https://www.esailyachtsimulator.com/wp-content/uploads/2018/11/esail-logo-e1544715402327.png", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/uploads/2021/06/asymmetric-spinnaker-sharpened.jpg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/uploads/2021/06/boat-cockpi-sharpened.jpg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/uploads/2021/06/esail-sailing-race-course-sharpened.jpg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/uploads/2021/06/Explore-sailing-545x350.jpg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/uploads/2021/06/eSail-race-and-volcanoedited-1-e1623430507951-545x350.jpg", "alt": ""}, {"url": "https p/assets/css/form-themes.css?ver=4.14.1", "https://www.esailyachtsimulator.com/wp-content/themes/esail/dest/css/style.css?ver=1790801225", "https://www.esailyachtsimulator.com/wp-content/themes/esail/dest/css/font-awesome.min.css?ver=7.1.2", "https://fonts.googleapis.com/css?family=Open+Sans&ver=7.1.2", "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/css/trp-language-switcher-v2.css?ver=3.3.6", "https://cdnjs.cloudflare.com/ajax/libs/cookieconsent2/3.1.0/cookieconsent.min.css"], "text": "Live Sailing & Sandbox – The Official Website of Virtual Sailing for PC & Mac\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\n“The most technically accurate sailing simulator\n\nI have experienced.”\n\nSIM UK\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nSupport\n\nHome\n\nThe World of eSail\n\nHow to Purchase\n\nLive Sailing & Sandbox\n\nSailing Challenges\n\nThe World of Shearwater\n\nLearn To Sail with eSail\n\nAbout Us\n\nVideos & Gallery\n\neSail Add-Ons\n\nMan Overboard\n\neSail Pro\n\nReviews\n\neSail News\n\nPrevious\n\nNext\n\nLive Sailing & Sandbox\n\nLive Sailing\n\nenables you to explore the world of eSail exactly how you want to. Cruise the islands on your own or switch to multiplayer mode.\n\nTalk to other sailors using eSail’s ‘VHF’ chat radio. You have 19 channels to choose from with CH16 being used for initiating communication as well as listening for weather forecasts (on the hour).\n\nFind points of interest (POIs) to achieve Master Explorer status and open up new sailing areas.\n\nPractise skills like man overboard (add on required)\n\nCreate and join races, time trials and passages.\n\nSandbox\n\nprovides a way of developing your skills in a controlled environment where you are in charge of the wind and waves.\n\nExplore Points of Interest\n\nImagine chartering a yacht and then heading off to explore the canals of Little Venice or an active volcano (Mt. Mallory). Wherever you go there are points of interest (POIs) to discover.\n\nOnce you have collected the first POIS, a new level opens up with another chart and whole new areas to sail.\n\nSome POIs are easy to find – others need a little more perseverance…\n\nMultiplayer Challenges\n\nMultiplayer challenges are created by a small team of volunteers and are available to all players using the menu inside eSail.\n\nRaces with up to 10 boats with various levels of difficulty\n\nTime trials\n\nPassages – which can also include finding Points of Interest (POIs)\n\nWhichever challenge you choose, it is helpful to learn keyboard shortcuts and know a bit about trimming sails for optimum twist – see\n\nAdvanced Tutorials\n\n.\n\nCreate your own challenges\n\nTo make a challenge you first need to create a course. This means sailing (or motoring) to your chosen area and dropping marker buoys from your stern into the water.\n\nEach course can be used for multiple challenges – races, time trials or passages where participants use their sailing or navigational skills to follow your course.\n\nShare your challenges with friends using a unique access code. Just paste it into the built in VHF chat or send by email, social media etc.\n\nSandbox\n\nUsing sandbox you can set wind speed, direction, wave height and see how your boat responds with different sail plans and trim. The readouts give you instant feedback to show how the lift and drag forces are working on your sails.\n\nSandbox also shows your heel as well as how your speed is being reduced by over-heeling. Working out how to reduce heel by adding sail twist is one of the most useful skills when racing.\n\neSail is available for Windows and Apple Mac.\n\nJoin the eSailing community now!\n\nHOW TO PURCHASE\n\nFollow Us\n\nSupport\n\nHow to Purchase\n\nRegistered Office:\n\nSuite 3 1-3 Warren Court Park R il with eSail\n\nAbout Us\n\nVideos & Gallery\n\neSail Add-Ons\n\nMan Overboard\n\neSail Pro\n\nReviews\n\neSail News\n\neSail Community News\n\neSail Development\n\neSail Reviews\n\neSail Updates\n\nFeatured\n\nChris Baldwin\n\nNew eSail Pro launched!\n\n(August 8th 2023) eSail Pro has been launched today, the latest add-on for eSail Sailing Simulator. eSail Pro takes the simulator to the next level with advanced instruments, a refillable fuel tank and more.\n\nThe new instruments include a fuel gauge which also shows engine hours. You can fill your new fuel tank (size 15 gallons) at Port Fogerty on the South of the main Shearwater Island.\n\nYou also get a new wind indicator, showing true and apparent wind speed/direction. Below this you have a new autopilot instrument, providing incremental controls and the ability to set the autopilot to the wind. This is very useful when you are racing, but is a convenience in general sailing too.\n\neSail Pro enables you to try more advanced sailing such as mooring under sail. And we have also added a Mooring Sandbox where you can set wind speed and direction to practise your mooring. This is supported by two new tutorials covering more advanced mooring techniques and how to get the best out of eSail Pro.\n\neSail Pro\n\nHow to Purchase\n\neSail\n\nPosted in\n\neSail Community News\n\nFollow Us\n\nSupport\n\nHow to Purchase\n\nRegistered Office:\n\nSuite 3 1-3 Warren Court Park Road, Crowborough, East Sussex, England, TN6 2QX\n\neSail ® is a registered trademark. © 2026 Copyright eSail Ltd.\n\nWhile all reasonable care has been taken in producing eSail the publisher can accept no responsibility for any errors or omissions or consequences of using any methods or processes described. The world and charts included in eSail are entirely fictional and must not be used for navigation.\n\nPrivacy Policy\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais ation etc.\n\n8) Numerous bug fixes, especially improved AutoSail to make it more consistent.\n\nSee eSail on\n\nSteam\n\neSail\n\nPosted in\n\neSail Updates\n\nFollow Us\n\nSupport\n\nHow to Purchase\n\nRegistered Office:\n\nSuite 3 1-3 Warren Court Park Road, Crowborough, East Sussex, England, TN6 2QX\n\neSail ® is a registered trademark. © 2026 Copyright eSail Ltd.\n\nWhile all reasonable care has been taken in producing eSail the publisher can accept no responsibility for any errors or omissions or consequences of using any methods or processes described. The world and charts included in eSail are entirely fictional and must not be used for navigation.\n\nPrivacy Policy\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nChange Language\n\nClose and do not switch language\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nChange Language\n\nClose and do not switch language"}, {"url": "https://www.esailyachtsimulator.com/new-esail-update-due-soon/", "title": "New eSail update due soon! – The Official Website of Virtual Sailing for PC & Mac", "text_file": "pages/new-esail-update-due-soon/text.txt", "html_file": "pages/new-esail-update-due-soon/source.html", "characters": 2114, "images": [{"url": "https://www.esailyachtsimulator.com/wp-content/uploads/2018/11/esail-logo-e1544715402327.png", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/uploads/2019/03/Sailing-simulator-ropes.jpg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/uploads/2019/03/Sailing-simulator-ropes-600x378.jpg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/up  women’s) value £13.49\n\nMeanwhile, you can of course order other gifts from the NEW\n\neSail Webstore\n\n.\n\nI look forward to seeing you in a Winter Series race!\n\nBest regards,\n\nChris Baldwin and the eSail Team\n\nCOMPETITON RULES\n\nEntry is open to all users of eSail except employees (and their families) of eSail Ltd and Valve Corporation and the suppliers of the prizes and any other companies associated with the competition.\n\nOnly one entry is allowed per person.\n\nAll entries must be made directly by the person entering the competition.\n\nEntries made online using methods generated by a script, macro or the use of automated devices will be void.\n\nNo responsibility can be accepted for entries lost, delayed or corrupted, or due to computer error in transit or due to eSail software or server failures or failures of any eSail supplier.\n\nChallenge places are always limited. No responsibility will be accepted if there are not enough places for everyone. Places are offered on a first come first served basis.\n\nThe finishing positions will be calculated by eSail software and eSail servers. These positions may differ from the positions as viewed by competitors.\n\nThe prizes are as stated, are not transferable to another individual and no cash or other alternatives will be offered.\n\nThe promoters reserve the right to amend or alter the terms of competitions and reject entries or deduct points from entrants not entering into a spirit of fair competition.\n\nIn the event of a prize being unavailable, the promoter reserves the right to offer an alternative prize of equal or greater value.\n\nThe winner(s) agree(s) to the use of their Steam name and country being used for publicity purposes.\n\nReasonable efforts will be made to contact the winner(s). If the winner(s) cannot be contacted, or are unable to comply with these terms and conditions, the Promoter reserves the right to offer the prize to the runner(s)-up selected by the same judges.\n\nFailure to respond and/or provide an address for delivery, or failure to meet the eligibility requirements may result in forfeiture of the prize.\n\nThe decision of the judges is final and no correspondence will be entered into over this decision. Competitions may be modified or withdrawn at any time.\n\nOnly the Steam name and country of the winners will be disclosed.\n\neSail\n\nPosted in\n\neSail Community News\n\nFollow Us\n\nSupport\n\nHow to Purchase\n\nRegistered Office:\n\nSuite 3 1-3 Warren Court Park Road, Crowborough, East Sussex, England, TN6 2QX\n\neSail ® is a registered trademark. © 2026 Copyright eSail Ltd.\n\nWhile all reasonable care has been taken in producing eSail the publisher can accept no responsibility for any errors or omissions or consequences of using any methods or processes described. The world and charts included in eSail are entirely fictional and must not be used for navigation.\n\nPrivacy Policy\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nChange Language\n\nClose and do not switch language\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nChange Language\n\nClose and do not switch language"}, {"url": "https://www.esailyachtsimulator.com/new-man-overboard-add-on/", "title": "New ‘Man Overboard’ Add-on Launched – The Official Website of Virtual Sailing for PC & Mac", "text_file": "pages/new-man-overboard-add-on/text.txt", "html_file": "pages/new-man-overboard-add-on/source.html", "characters": 3247, "images": [{"url": "https://www.esailyachtsimulator.com/wp-content/uploads/2018/11/esail-logo-e1544715402327.png", "alt": ""}, {"url": "https://www.esailyachtsimulat //www.esailyachtsimulator.com/wp-content/themes/esail/dest/css/style.css?ver=1790809668", "https://www.esailyachtsimulator.com/wp-content/themes/esail/dest/css/font-awesome.min.css?ver=7.1.2", "https://fonts.googleapis.com/css?family=Open+Sans&ver=7.1.2", "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/css/trp-language-switcher-v2.css?ver=3.3.6", "https://cdnjs.cloudflare.com/ajax/libs/cookieconsent2/3.1.0/cookieconsent.min.css"], "text": "New ‘Man Overboard’ Add-on Launched – The Official Website of Virtual Sailing for PC & Mac\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\n“The most technically accurate sailing simulator\n\nI have experienced.”\n\nSIM UK\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nSupport\n\nHome\n\nThe World of eSail\n\nHow to Purchase\n\nLive Sailing & Sandbox\n\nSailing Challenges\n\nThe World of Shearwater\n\nLearn To Sail with eSail\n\nAbout Us\n\nVideos & Gallery\n\neSail Add-Ons\n\nMan Overboard\n\neSail Pro\n\nReviews\n\neSail News\n\neSail Community News\n\neSail Development\n\neSail Reviews\n\neSail Updates\n\nFeatured\n\nChris Baldwin\n\nNew ‘Man Overboard’ Add-on Launched\n\n(8th December 2019) eSail has today launched a new ‘Man Overboard’ (MOB) add-on for eSail Sailing Simulator. The add-on – or downloadable content (DLC) – has been developed with the help of marine safety expert Keith Colwell, author of the\n\nRYA Sea Survival Handbook\n\n. It includes tutorials, challenges and random triggering of MOB during normal sailing. The drill includes heaving-to, deploying equipment and recovery of the MOB under power and sail.\n\n‘Man Overboard’ features 2 tutorials, 2 challenges and a random MOB mode while ‘Live Sailing’ so you can test your readiness when the unexpected happens.\n\nMan Overboard on Steam\n\nMan Overboard was created in close collaboration with Keith Colwell. Keith has worked for many years as a reporter and editor for sailing journals. He has also worked for the RNLI for 15 years and during that time trained and managed RNLI Sea Safety and Community Safety volunteers to give advice to yachtsmen, boat users and the general public on how to stay safe when on or by the water. He became a RYA sea survival, powerboat and marine vhf radio instructor/assessor in 2004, while working for the RNLI, and currently works as a freelance instructor.\n\nThe ‘Man Overboard’ add-on is part of eSail’s commitment to improving and increasing the quality of learning tools available for the sailing community. See more about learning to sail with eSail\n\nhere\n\n.\n\neSail\n\nPosted in\n\neSail Community News\n\nFollow Us\n\nSupport\n\nHow to Purchase\n\nRegistered Office:\n\nSuite 3 1-3 Warren Court Park Road, Crowborough, East Sussex, England, TN6 2QX\n\neSail ® is a registered trademark. © 2026 Copyright eSail Ltd.\n\nWhile all reasonable care has been taken in producing eSail the publisher can accept no responsibility for any errors or omissions or consequences of using any methods or processes described. The world and charts included in eSail are entirely fictional and must not be used for navigation.\n\nPrivacy Policy\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nChange Language\n\nClose and do not switch language\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nChange Language\n\nClose and do not switch language"}, {"url": "https://www.esailyachtsimulator.com/new-update-v1-5-31/", " glish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nSupport\n\nHome\n\nThe World of eSail\n\nHow to Purchase\n\nLive Sailing & Sandbox\n\nSailing Challenges\n\nThe World of Shearwater\n\nLearn To Sail with eSail\n\nAbout Us\n\nVideos & Gallery\n\neSail Add-Ons\n\nMan Overboard\n\neSail Pro\n\nReviews\n\neSail News\n\nPrivacy Policy\n\nThis privacy policy (“policy”) will help you understand how eSail Ltd uses and protects the data you provide to us when you visit and use our website and software. We reserve the right to change this policy at any given time. If you want to make sure that you are up to date with the latest changes, we advise you to frequently visit this page.\n\nWhat User Data We Collect\n\nWhen you visit our website or use our software we may collect and store:\n\n– Your IP address.\n\n– Your contact information and email address.\n\n– Other information such as interests and preferences.\n\n– Data profile regarding your online behavior on our website and in our software.\n\nWhy We Collect Your Data\n\nWe are collecting your data for several reasons:\n\n– To better understand your needs.\n\n– To improve our services and products.\n\n– To send you promotional emails containing the information we think you will find interesting.\n\n– To contact you to fill out surveys and participate in other types of market research.\n\n– To customize our website according to your online behavior and personal preferences.\n\nSafeguarding and Securing the Data\n\neSail Ltd is committed to securing your data and keeping it confidential. eSail Ltd has done all in its power to prevent data theft, unauthorized access, and disclosure by implementing the latest technologies and software, which help us safeguard all the information we collect online.\n\nOur Cookie Policy\n\nOnce you agree to allow our website to use cookies, you also agree to use the data it collects regarding your online behavior (analyze web traffic, web pages you spend the most time on, and websites you visit).\n\nThe data we collect by using cookies is used to customize our website to your needs. After we use the data for statistical analysis, the data is completely removed from our systems.\n\nPlease note that cookies don’t allow us to gain control of your computer in any way. They are strictly used to monitor which pages you find useful and which you do not so that we can provide a better experience for you.\n\nIf you want to disable cookies, you can do it by accessing the settings of your internet browser.\n\nLinks to Other Websites\n\nOur website contains links that lead to other websites. If you click on these links eSail Ltd is not held responsible for your data and privacy protection. Visiting those websites is not governed by this privacy policy agreement. Make sure to read the privacy policy documentation of the website you go to from our website.\n\nRestricting the Collection of your Personal Data\n\nAt some point, you might wish to restrict the use and collection of your personal data. You can achieve this by doing the following:\n\nWhen you are filling the forms on the website, make sure to check if there is a box which you can leave unchecked, if you don’t want to disclose your personal information.\n\nIf you have already agreed to share your information with us, feel free to contact us via our website Support form and we will be more than happy to change this for you.\n\neSail Ltd will not lease, sell or distribute your personal information to any third parties, unless we have your permission. We might do so if the law forces us.\n\neSail is available for Windows and Apple Mac.\n\nJoin the eSailing community now!\n\nHOW TO PURCHASE\n\nFollow Us\n\nSupport\n\nHow to Purchase\n\nRegistered Office:\n\nSuite 3 1-3 Warren Court Park Road, Crowborough, East Sussex, England, TN6 2QX\n\neSail ® is a registered trademark. © 2026 Copyright eSail Ltd.\n\nWhile all reasonable care has been ta ibs/cookieconsent2/3.1.0/cookieconsent.min.css"], "text": "Reviews – The Official Website of Virtual Sailing for PC & Mac\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\n“The most technically accurate sailing simulator\n\nI have experienced.”\n\nSIM UK\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nSupport\n\nHome\n\nThe World of eSail\n\nHow to Purchase\n\nLive Sailing & Sandbox\n\nSailing Challenges\n\nThe World of Shearwater\n\nLearn To Sail with eSail\n\nAbout Us\n\nVideos & Gallery\n\neSail Add-Ons\n\nMan Overboard\n\neSail Pro\n\nReviews\n\neSail News\n\nReviews\n\n“If you’re new to sailing this is a fantastic way to learn at home and brush up skills. If you’re an experienced sailor then it’s still great fun and adventures can be had navigating around using charts or sailing through challengingly tight spaces!”\n\nPractical Boat Owner\n\neSail – Sailing Simulator has raised the benchmark higher for comprehensive, fully detailed and exhaustively accurate Sailing education. Simply put the tutorials included here are brilliant!\n\nSim UK\n\n“There is a vast amount to explore and learn in the simulator… the thought processes and actions required to sail your virtual boat are remarkably close to the real world, so the old grey cells are going through the same processes. It was realistic enough to be genuinely engaging and enjoyable to use.”\n\nYachting Monthly\n\nSee all user reviews on\n\nSteam\n\n“I’ve played a few boating sims & this one has the most realistic wave & boat dynamics, plus other sailing sims usually focus on racing and just sailing whereas this enables you to have a go at anchoring, mooring alongside in harbour & has a comprehensive selection of sailing operations (correct procedure for operating sheets/halyards) plus realistic boat reactions to various operations & weather conditions.\n\nAll in all pretty realistic for a PC sim & I own my own yacht so can appreciate the realism. The only downside for me is that I would like more of the world to sail in, although I believe the developers are working on adding some new scenery. Only a minor gripe is also the graphics quality of the boat & scenery but I appreciate this is probably so we can have realistic boat handling & dynamics which I would rather have than pretty stuff to look at! Thanks very much for this & well done on a great job!”\n\nUSER REVIEW\n\n“A few things I find particularly great about this sim which outmatches other sailing games/sims is\n\n1) the weather – just as you do in Real life, if you go behind a headland or mountain range sheltered from the wind, it drops and the sea-state eases – BRILLIANT!\n\n2) the anchoring part of this sim is spot-on and I found myself doing just the same things (and making the same errors!) as I had done on my own boats!\n\n3) the third & final thing is the mooring feature – only one other sim supported this and that was very basic in nature by clicking one button – here you are able to control the lines and ease or tighten them to your satisfaction!\n\nThen when it’s time to go out again, you can create slip-lines and ease your boat slowly out of its berth!”\n\nUSER REVIEW\n\n“If you are an experienced sailor, you will be comfortable with all the lines, winches and jammers you’ll need to operate a 38′ yacht. She comes complete with a main and jib, a cabin with a nav table, running lights, a rudimentary GPS, water fowl and sea life, and an inboard engine!” USER REVIEW\n\neSail is available for Windows and Apple Mac.\n\nJoin the eSailing community now!\n\nHOW TO PURCHASE\n\nFollow Us\n\nSupport\n\nHow to Purchase\n\nRegistered Office:\n\nSuite 3 1-3 Warren Court Park Road, Crowborough, East Sussex, England, TN6 2QX\n\neSail ® is a registered trademark. © 2026 Copyright eSail Ltd.\n\nWhile all reasonable care has been taken in 168.jpg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/en_US.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/fr_FR.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/de_DE.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/tr_TR.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/es_ES.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/pt_PT.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/pt_BR.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/el.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/it_IT.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/flags/4x3/nl_NL.svg", "alt": ""}, {"url": "https://www.esailyachtsimulator.com/wp-content/uploads/2019/03/star.png", "alt": ""}], "stylesheets": ["https://www.esailyachtsimulator.com/wp-content/plugins/contact-form-7/includes/css/styles.css?ver=6.1.7", "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-business/add-ons-pro/automatic-language-detection/assets/css/trp-popup.css?ver=1.1.2", "https://www.esailyachtsimulator.com/wp-content/plugins/mailchimp-for-wp/assets/css/form-themes.css?ver=4.14.1", "https://www.esailyachtsimulator.com/wp-content/themes/esail/dest/css/style.css?ver=1790808236", "https://www.esailyachtsimulator.com/wp-content/themes/esail/dest/css/font-awesome.min.css?ver=7.1.2", "https://fonts.googleapis.com/css?family=Open+Sans&ver=7.1.2", "https://www.esailyachtsimulator.com/wp-content/plugins/translatepress-multilingual/assets/css/trp-language-switcher-v2.css?ver=3.3.6", "https://cdnjs.cloudflare.com/ajax/libs/cookieconsent2/3.1.0/cookieconsent.min.css"], "text": "Sound Signals on the Water – The Official Website of Virtual Sailing for PC & Mac\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\n“The most technically accurate sailing simulator\n\nI have experienced.”\n\nSIM UK\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nSupport\n\nHome\n\nThe World of eSail\n\nHow to Purchase\n\nLive Sailing & Sandbox\n\nSailing Challenges\n\nThe World of Shearwater\n\nLearn To Sail with eSail\n\nAbout Us\n\nVideos & Gallery\n\neSail Add-Ons\n\nMan Overboard\n\neSail Pro\n\nReviews\n\neSail News\n\nSound Signals on the Water\n\nWhy Is That Boat Honking At Me?\n\nBy Nellie Bly\n\nBoats manoeuvring in close proximity or in conditions of limited visibility should communicate their position or intentions with sound signals.\n\nVirtually every boat is required to have some sound producing device. There is a great deal of latitude in what type of sound making device you choose but the louder the better.\n\nThe\n\nUS Coast Guard\n\nmandates vessels over 12 meters (approximately 40 feet) be equipped with at least a whistle.\n\nVessels over 20 meters (approximately 65 feet) must be equipped with at least a whistle and a bell.\n\nAnd vessels over 100 meters (approximately 328 feet) must be equipped with at least a whistle, a bell, and a gong.\n\nBoats less than 12 meters must carry “an efficient sound producing device — preferably a bell, whistle or air horn — although guns or even pots and pans might be used in an emergency.\n\nWhen and How to Sound Off\n\nSound signals are to be used only when vessels are in sight of each other and are meeting or crossing at a distance within half a mile of each other. These signals must never be used in fog or other conditions of reduced visibility, where the vessels are not visible to each other by eye. Only the fog signals listed below may be sounded in conditions of restricted visibility\n\nSound signals are called “blasts”. There are two different blasts used for warning and steering signals.\n\nShort Blast\n\n– about one second duration\n\nProlonged Blast\n\n– four to six seconds duration\n\nA bell can be sounded as a single ring or as a rapid ringing for five seconds, and a gong is rung rapidly.\n\nInternational Manoeuvring Signals When Under Power\n\nRemember that a sailboat is “under power” when the engine is on, even if the sails are up.\n\nThere are different blasts combinations for various movements on the water. When power-driven vessels are in sight of one another and meeting or crossing at a distance within half a mile of each other, each vessel underway must use the following sound signals.\n\nOne Short Blast\n\n– This means “I intend to leave you on MY port side”.\n\nWhen you pass near another boat, you will manoeuvre to leave them on your left side as you pass. I\n\nIf you are behind another boat, going the same direction and about to overtake it, one short blast means: “I intend to pass you on YOUR starboard side, MY port side”.\n\nOne Prolonged Blast\n\n– This means you are leaving a dock or departing your slip. It signals to others a change in status and that you are getting underway.\n\nA prolonged blast is also sounded when a vessel is approaching a bend or an area of channel where other vessels may be obscured from view. It is sometimes referred to as the “blind bend signal”. This signal should be answered with a prolonged blast to indicate your presence.\n\nTwo Short Blasts\n\n– This means “I intend to leave you on MY starboard side”. When you pass near another boat, you will manoeuvre to leave them on your right side as you pass. If you are behind another boat, going the same direction and about to overtake it, two short blasts means: “I intend to pass you on YOUR port side, MY starboard side.”\n\nThree Short Blasts\n\n– This means you are operating in astern propulsion. It is important to note that the operating astern signal refers to the shaft and propeller not to the actual motion of the vessel which can be either forward or astern.\n\nOne Prolonged Blast + Three Short Blasts\n\n– This is technically two different signals in succession. One prolonged blast indicates you are getting under way, and three short blasts indicate you are backing up. This is what is sounded when you are departing a dock in reverse.\n\nFive Short Blasts\n\n– This is the DANGER signal.\n\nWhen you approach another vessel and hear either one or two short blasts –and you both understand their signal and can safely let them do it – then you are required to respond with the same signal in response. However, if you don’t understand their intentions or feel their proposed manoeuvre is dangerous to either vessel you are required to sound the DANGER signal.\n\nPower Driven Vessels in a Narrow Channel\n\nThe following sound signals are used when vessels are in sight of one another in a narrow channel or fairway:\n\nTwo Prolonged Blasts followed by One Short Blast\n\n– “I intend to overtake you on your starboard side”\n\nTwo Prolonged Blasts followed by Two Short Blasts\n\n– “I intend to overtake you on your\n\nport side”\n\nIf in agreement with these manoeuvres you should acknowledge by the following signal:\n\nOne Prolonged, One Short, One Prolonged, and One Short Blast, in that order.\n\nConversely, if the vessel being overtaken is in doubt about the safety of the proposed manoeuvre, or you doubt whether sufficient action is being taken to avoid a collision, you should signal the above five short and rapid blasts of the danger signal to indicate that their intentions are unclear.\n\nSound Signals In Restricted Visibility\n\nSounds on the water are many and varied. Bells, gongs, fog horns, boat whistles all combine to produce a confusing cacophony. Knowing the different types and variety of devices used by the various classes of vessel helps mariners detect the scale of an unseen vessel by the sound it makes. If motoring, you may have to turn off the engine at regular intervals to listen for the sound signal of other vessels or of navigation aids. Do not assume a direction for the maritime horn signal as it can be distorted by fog so stop and double-check the direction then proceed with caution.\n\nOne Prolonged Blast\n\nat intervals of not more than two minutes is the signal used by power-driven vessels when making way.\n\nOne Prolonged Blast plus Two Short Blasts\n\nat intervals of not more than two minutes is the signal used by sailboats.\n\nPowerboats or sailboats under power must give signals of One Prolonged blast every 2 minutes to indicate their changing position as they move through the water.\n\nA powerboat or sailboat under power that is stopped (not moving through the water) must give signals of Two Prolonged blasts every two minutes to indicate their position.\n\nA sailboat or any boat that is restricted in its ability to move, towing or pushing another boat, or is currently engaged in fishing, must give One Prolonged Blast and Two Short Blasts every two minutes.\n\nIf you are boating in conditions of restricted visibility and you hear any of these signals, slow down to minimum speed until you can safely ascertain your relative positions and move forward without a collision.\n\nSound signals are not totally necessary during days of clear visibility, as long as you keep a safe distance between yourself and other boats, but they are a must on foggy days.\n\nInland Waterways\n\nSome countries may have different inland waterway regulations, for example in the United States port and starboard signals are reversed and there are different overtaking signals.\n\nInland waters are noted by dashed magenta lines on many charts and labelled COLREGS DEMARCATION LINES which are the boundaries of restricted-navigation zones. To seaward of these lines, or where the lines do not exist, a skipper must follow the International rules – more formally known as the\n\n1972 International Regulations for Preventing Collisions at Sea\n\n(72 COLREGS). Where these lines exist, and inshore of them, a skipper must use the specific Inland Waterway Rules.\n\nPhoto\n\n71431168\n\n©\n\nNightman1965\n\n–\n\nDreamstime.com\n\neSail is available for Windows and Apple Mac.\n\nJoin the eSailing community now!\n\nHOW TO PURCHASE\n\nFollow Us\n\nSupport\n\nHow to Purchase\n\nRegistered Office:\n\nSuite 3 1-3 Warren Court Park Road, Crowborough, East Sussex, England, TN6 2QX\n\neSail ® is a registered trademark. © 2026 Copyright eSail Ltd.\n\nWhile all reasonable care has been taken in producing eSail the publisher can accept no responsibility for any errors or omissions or consequences of using any methods or processes described. The world and charts included in eSail are entirely fictional and must not be used for navigation.\n\nPrivacy Policy\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nChange Language\n\nClose and do not switch language\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nChange Language\n\nClose and do not switch language"}, {"url": "https://www.esailyachtsimulator.com/support/", "title": "Support – The Official Website of Virtual Sailing for PC & Mac", "text_file": "pages/suppor n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\n“The most technically accurate sailing simulator\n\nI have experienced.”\n\nSIM UK\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nSupport\n\nHome\n\nThe World of eSail\n\nHow to Purchase\n\nLive Sailing & Sandbox\n\nSailing Challenges\n\nThe World of Shearwater\n\nLearn To Sail with eSail\n\nAbout Us\n\nVideos & Gallery\n\neSail Add-Ons\n\nMan Overboard\n\neSail Pro\n\nReviews\n\neSail News\n\nAbout Us\n\nThe sailing simulator has been developed by a small team with experience in e-learning, sailing and software development. Our goal is to provide high quality simulation based learning and entertainment.\n\nChris Baldwin\n\nChris has a background in elearning and over 20 years of software development and marketing experience in the UK and US. Chris started the health & safety elearning and risk management company Cardinus and sold it to THB Group in 2007. Cardinus provides e-learning used by thousands of organisations across the globe to reduce accidents and injury, increase employee productivity and comply with legislation.\n\nChris began sailing around 2010, taking family sailing holidays each year in Greece and Turkey. When he found that he was forgetting so much in between charters he looked around at sailing simulators to refresh his knowledge, but was dissapointed that those available focussed entirely on racing, and didn’t really help with real life skills.\n\nSo Chris returned to his roots and began coding. Three years later eSail was launched on Steam.\n\nKeith Colwell\n\nKeith is the author of the internationally-published\n\nRYA Sea Survival Handbook\n\nand the\n\nRYA Boat Safety Handbook\n\nand continues to write for PBO magazine as their sea safety correspondent.\n\nKeith trained as a naval architect at Southampton and Sunderland Colleges in the late 1970s. Following a couple of years as a development engineer for a small workboat builder, he was offered the role of Technical Reporter on the magazine Motor Boat and Yachting, before moving on to become Technical Editor (Power) and then Deputy Editor of Practical Boat Owner (PBO) magazine and finally Development Editor of Sailing Today.\n\nAfter a 22-year career as a staff boating journalist testing boats and equipment, Keith made a career change and joined the Royal National Lifeboat Institution (RNLI) as a Sea Safety Manager. During his 15 years with the RNLI, Keith trained and managed RNLI Sea Safety and Community Safety volunteers to give advice to yachtsmen, boat users and the general public on how to stay safe when on or by the water. He became a RYA sea survival, powerboat and marine vhf radio instructor/assessor in 2004, while working for the RNLI, and currently works as a freelance instructor.\n\nTheo Stocker\n\nHaving caught the bug for yacht cruising as a teenager on the rivers of the East Coast, Theo has since explored far and wide under sail – north to the Lofoten Islands, south to Morocco, the Gambia and Senegal, east to the Baltic and the Mediterranean and west to the Caribbean. He sailed the family Hallberg Rassy 31 for a number of years, but is now the proud owner of a Sadler 29, kept on the Lymington river, from where he and his wife Georgie cruise both sides of the English Channel.\n\nAfter stints in the Royal Navy and in public relations in the City, Theo combined the best of both worlds and began writing for\n\nYachting Monthly\n\nas a freelance contributor. He joined the team in 2014 and has been editing the magazine since 2017.\n\nJon Dobbin\n\nJon started dinghy sailing in Plymouth and Falmouth Harbours at school, then cruising and racing in the Solent at college.\n\nFor for several years Jon worked in cancer research then ran a unit studying stroke and brain injuries, and began sailing with the Ocean Youth Trust. At this time he was also instructing cruising and racing and delivering Halberg Rassey, Nijad, and Sweden yachts from Sweden and qualified as Yachtmaster Ocean.\n\nHe later started a successful project management and tuition business primarily with Northshore Yachtyards and qualified as a Yachtmaster instructor.\n\nJon is currently involved in providing sailing tuition and supporting the Ocean Youth Trust.\n\neSail is available for Windows and Apple Mac.\n\nJoin the eSailing community now!\n\nHOW TO PURCHASE\n\nFollow Us\n\nSupport\n\nHow to Purchase\n\nRegistered Office:\n\nSuite 3 1-3 Warren Court Park Road, Crowborough, East Sussex, England, TN6 2QX\n\neSail ® is a registered trademark. © 2026 Copyright eSail Ltd.\n\nWhile all reasonable care has been taken in producing eSail the publisher can accept no responsibility for any errors or omissions or consequences of using any methods or processes described. The world and charts included in eSail are entirely fictional and must not be used for navigation.\n\nPrivacy Policy\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nChange Language\n\nClose and do not switch language\n\nWe've detected you might be speaking a different language. Do you want to change to:\n\nEnglish\n\nEnglish\n\nEnglish\n\nFrançais\n\nDeutsch\n\nTürkçe\n\nEspañol\n\nPortuguês\n\nPortuguês do Brasil\n\nΕλληνικά\n\nItaliano\n\nNederlands\n\nChange Language\n\nClose and do not switch language"}, {"url": "https://www.esailyachtsimulator.com/the-world-of-esail/challenges/", "title": "Sailing Challenges – The Official Website of Virtual Sailing for PC & Mac", "text_file": "pages/the-world-of-esail__challenges/text.txt", "html_file": "pages/the-world-of-esail__challenges/source.html", "characters": 4394, "images": [{"url": "https://www.esailyachtsimulator.com/wp-content/uploads/2018/11/esail-logo-e15
